server {
    listen 8080;
    server_name localhost;
    root /var/www/html;
    index index.php;
    server_tokens off;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /healthz { access_log off; return 200 'ok'; }
    location = /install/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:system|app|template|install|_doc|docker|tools|tests|bin|docs|var)(?:/|$) { return 404; }
    location ~* ^/admin/(?:app|template)(?:/|$) { return 404; }
    location ~* \.(?:sql|log|ini|ya?ml|env|bak|md|conf)$ { return 404; }
    location ~* ^/(?:config(?:\.local)?(?:\..*)?|compose.*|LICENSE)$ { return 404; }
    location ~* /(?:examples|swfupload)/ { return 404; }

    location /upload/ {
        location ~* \.(?:php[0-9]*|phtml|phar|html?|svg|shtml|js)(?:/|$) { return 404; }
        try_files $uri =404;
    }

    location ~ ^/(?:index|vccore|admin/index|admin/login|admin/api/(?:upload|files|thumbnail))\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }
    location ~* \.php(?:/|$) { return 404; }

    location / {
        if (!-f $request_filename) {
            rewrite ^/index.html$ /index.php?controller=home&operate=index last;
            rewrite ^/tags\.html$ /index.php?controller=tags last;
            rewrite ^/content_([^/]+)_([0-9]+).html$ /index.php?controller=content&project=$1&id=$2 last;
            rewrite ^/tags/(.*)_([0-9]+).html$ /index.php?controller=search&tags=$1&page=$2 last;
            rewrite ^/tags/(.*).html$ /index.php?controller=search&tags=$1 last;
            rewrite ^/([^/]+)_([^/]+)_([0-9]+)_([0-9]+).html$ /index.php?controller=classify&project=$1&classify=$2&classid=$3&page=$4 last;
            rewrite ^/([^/]+)_([^/]+)_([0-9]+).html$ /index.php?controller=classify&project=$1&classify=$2&classid=$3 last;
            rewrite ^/map.html$ /index.php?controller=map last;
            rewrite ^/message_add.html$ /index.php?controller=message&operate=add last;
            rewrite ^/message_([a-z]+)_([0-9]+).html$ /index.php?controller=message&operate=$1&id=$2 last;
            rewrite ^/message_([0-9]+).html$ /index.php?controller=message&page=$1 last;
            rewrite ^/message.html$ /index.php?controller=message last;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }
}
