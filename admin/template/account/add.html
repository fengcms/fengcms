<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>创建系统账号</title>
<link href="css/css.css" rel="stylesheet">
<link href="public/jquery/validform/css.css" rel="stylesheet">
</head>
<body>
<div id="main">
    <form id="account-create" method="post" action="?controller=account&operate=create" class="form">
        <div id="main_top"><dl id="article_ico">
            <dd class="art_ico_8"><a href="#" onclick="document.getElementById('account-create').requestSubmit();return false;">确认创建</a></dd>
            <dd class="art_ico_9"><a href="?controller=account">返回列表</a></dd>
        </dl></div>
        <div id="art_body"><table cellspacing="0" class="add_art">
            <tr><th>用户名：</th><td><input class="inputxt" name="username" required minlength="5" maxlength="64" pattern="[A-Za-z][A-Za-z0-9_.-]{4,63}" autocomplete="off" style="width:300px"></td></tr>
            <tr><th>初始密码：</th><td><input class="inputxt" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" style="width:300px"> <span class="color999">至少 8 个字符，最多 72 字节</span></td></tr>
            <tr><th>账号类型：</th><td><select class="inputxt" name="role" required style="width:312px"><option value="editor">编辑</option><option value="super_admin">超级管理员</option></select> <span class="color999">超级管理员可以管理后台全部功能和账号</span></td></tr>
        </table></div>
    </form>
</div>
</body>
</html>
