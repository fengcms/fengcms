name: fengcms-dev

x-php: &php
  build:
    context: ./docker/php
    args:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      LOCAL_UID: ${LOCAL_UID:-1000}
  image: fengcms-dev-php:${PHP_VERSION:-8.4}
  working_dir: /var/www/html
  environment: &app-env
    DB_HOST: db
    DB_USER: fengcms
    DB_PASS: ${DB_PASSWORD:?Run ./bin/dev up first}
    DB_NAME: fengcms
    DB_PREFIX: f_
    ADMIN_CODE: ${ADMIN_CODE:?Run ./bin/dev up first}
    APP_KEY: ${APP_KEY:?Run ./bin/dev up first}
    APP_DEBUG: "0"
    APP_RUNTIME_PATH: /var/lib/fengcms
    FENGCMS_DISABLE_INSTALL: "1"
  volumes:
    - .:/var/www/html:ro
    # Only front-end templates and styles are editable through the CMS.
    - ./template:/var/www/html/template
    - ./css:/var/www/html/css
    - frontend-cache:/var/www/html/app/cache
    - backend-cache:/var/www/html/admin/app/cache
    - backups:/var/www/html/admin/app/dbbackup
    - uploads:/var/www/html/upload
    - runtime:/var/lib/fengcms
  networks: [app, database]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: mysql:8.4
    # Regression tests use short-lived row-specific fault-injection triggers.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run ./bin/dev up first}
      MYSQL_DATABASE: fengcms
      MYSQL_USER: fengcms
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run ./bin/dev up first}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
    security_opt: [no-new-privileges:true]

  php:
    <<: *php
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: [CMD-SHELL, 'php -r ''exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);''']
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-18080}:8080"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/html/upload:ro
    depends_on:
      php: {condition: service_healthy}
    networks: [app, edge]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 15

  setup:
    <<: *php
    profiles: [tools]
    environment:
      <<: *app-env
      FENGCMS_ADMIN_PASSWORD: ${FENGCMS_ADMIN_PASSWORD:?Run ./bin/dev up first}
      FENGCMS_DEV_SETUP: "1"
    depends_on:
      db: {condition: service_healthy}
    command: [php, tools/bootstrap.php]

networks:
  edge:
  app: {internal: true}
  database: {internal: true}

volumes:
  mysql-data:
  frontend-cache:
  backend-cache:
  backups:
  uploads:
  runtime:
